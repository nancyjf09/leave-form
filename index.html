<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Application – Karmela Rani Training College, Kollam</title>
<style>
:root{--p:#6a1b9a;--p2:#e91e63;--o:#ff9800;--t:#00897b;--b:#1e88e5;--g:#43a047;--r:#e53935;--ink:#2b2250;--bg:#fff7fb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fde7f3 0%,#e8eaff 50%,#e0f7f1 100%);min-height:100vh}
header{background:linear-gradient(110deg,#4a148c,#c2185b 55%,#ff8f00);color:#fff;padding:18px 16px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.25);position:relative}
header .logo{width:100px;height:140px;margin:0 auto 8px;display:block;border-radius:12px;background:#fff;padding:4px;box-shadow:0 0 0 4px rgba(255,255,255,.4)}
header .logo img,header .logo svg{width:100%;height:100%;border-radius:8px;object-fit:contain}
header h1{margin:4px 0 0;font-size:1.7rem;letter-spacing:.5px;text-shadow:0 2px 4px rgba(0,0,0,.3)}
header p{margin:2px 0 0;font-size:1rem;opacity:.95}
header .sub{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);padding:4px 16px;border-radius:20px;font-weight:600;letter-spacing:1px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:14px 8px 0}
nav button{border:0;padding:10px 18px;border-radius:24px;font-weight:700;cursor:pointer;color:#fff;font-size:.95rem;opacity:.75;transition:.2s;box-shadow:0 3px 8px rgba(0,0,0,.2)}
nav button.on,nav button:hover{opacity:1;transform:translateY(-2px)}
.n1{background:linear-gradient(135deg,#8e24aa,#d81b60)}.n2{background:linear-gradient(135deg,#1e88e5,#00acc1)}.n3{background:linear-gradient(135deg,#43a047,#00897b)}.n4{background:linear-gradient(135deg,#fb8c00,#e53935)}.n5{background:linear-gradient(135deg,#546e7a,#263238)}
main{max-width:980px;margin:16px auto 40px;padding:0 12px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(106,27,154,.18);border-top:6px solid var(--p2);margin-bottom:18px}
.card h2{margin:0 0 4px;color:var(--p)}
.hint{color:#6b6490;font-size:.9rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
label{display:block;font-weight:700;font-size:.85rem;margin-bottom:4px;color:var(--p)}
input,select,textarea{width:100%;padding:10px 12px;border:2px solid #e1d4f0;border-radius:10px;font:inherit;background:#fcfaff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p2);box-shadow:0 0 0 3px rgba(233,30,99,.15)}
textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}
.btn{border:0;padding:11px 22px;border-radius:12px;font-weight:700;color:#fff;cursor:pointer;font-size:.95rem;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.btn:hover{filter:brightness(1.1)}
.bp{background:linear-gradient(135deg,#8e24aa,#d81b60)}.bg{background:linear-gradient(135deg,#43a047,#00897b)}.br{background:linear-gradient(135deg,#e53935,#c62828)}.bb{background:linear-gradient(135deg,#1e88e5,#00acc1)}.bo{background:linear-gradient(135deg,#fb8c00,#f4511e)}
.clock{background:linear-gradient(90deg,#fff3e0,#fce4ec);border:2px dashed var(--o);border-radius:12px;padding:10px 14px;font-weight:700;color:#bf360c;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.msg{padding:12px 14px;border-radius:12px;margin:12px 0;font-weight:600}
.ok{background:#e8f5e9;color:#1b5e20;border-left:6px solid var(--g)}.err{background:#ffebee;color:#b71c1c;border-left:6px solid var(--r)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:700;color:#fff}
.s-pend{background:#fb8c00}.s-ok{background:#43a047}.s-no{background:#e53935}.s-fwd{background:#1e88e5}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:linear-gradient(90deg,#6a1b9a,#d81b60);color:#fff;padding:8px;text-align:left;position:sticky;top:0}
td{padding:8px;border-bottom:1px solid #eee;vertical-align:top}
tr:nth-child(even) td{background:#faf5ff}
.scroll{overflow-x:auto;max-height:480px}
.app{border:2px solid #eadcf7;border-radius:14px;padding:14px;margin-bottom:12px;background:linear-gradient(135deg,#fff,#faf5ff)}
.app .row{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.9rem;margin:4px 0}
.app .row b{color:var(--p)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tabs button{border:2px solid var(--p);background:#fff;color:var(--p);padding:6px 14px;border-radius:18px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.hide{display:none}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.act input{flex:1;min-width:180px}
</style>
</head>
<body>
<header>
  <div class="logo" id="logoBox"></div>
  <h1>Karmela Rani Training College</h1>
  <p>Kollam, Kerala</p>
  <span class="sub">STUDENT LEAVE APPLICATION</span>
</header>

<nav>
  <button class="n1 on" data-v="student">📝 Apply for Leave</button>
  <button class="n2" data-v="track">🔎 Track Application</button>
  <button class="n3" data-v="teacher">👩‍🏫 Teacher Login</button>
  <button class="n4" data-v="principal">🏛️ Principal Login</button>
  <button class="n5" data-v="admin">⚙️ Admin Console</button>
</nav>

<main id="app"></main>

/* ---------- Navigation ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;go()});
function go(){
  clearInterval(clockTimer);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  ({student:vStudent,track:vTrack,teacher:vTeacher,principal:vPrincipal,admin:vAdmin})[view]();
}

/* ---------- Status helpers ---------- */
function statusBadges(a){
  let h='';
  h+=a.teacher.status==='pending'?'<span class="badge s-pend">Teacher: Pending</span>':a.teacher.status==='approved'?'<span class="badge s-ok">Teacher: Approved</span>':'<span class="badge s-no">Teacher: Not Approved</span>';
  h+=' ';
  if(a.teacher.status==='rejected')h+='<span class="badge s-no">Closed – not forwarded</span>';
  else if(a.teacher.status==='pending')h+='<span class="badge s-pend">Principal: Awaiting teacher</span>';
  else h+=a.principal.status==='pending'?'<span class="badge s-fwd">Principal: Pending</span>':a.principal.status==='approved'?'<span class="badge s-ok">Principal: Approved</span>':'<span class="badge s-no">Principal: Not Approved</span>';
  return h;
}
function finalText(a){
  if(a.teacher.status==='rejected')return 'Not forwarded (not approved by teacher)';
  if(a.teacher.status==='pending')return 'Awaiting teacher';
  if(a.principal.status==='pending')return 'Pending with Principal';
  return (a.principal.status==='approved'?'APPROVED':'NOT APPROVED')+(a.principal.order?' – '+a.principal.order:'');
}
function appCard(a,actions=''){
  return `<div class="app"><div class="bar"><b style="color:#d81b60">Ref: ${esc(a.id)}</b><div>${statusBadges(a)}</div></div>
  <div class="row"><span><b>Student:</b> ${esc(a.name)}</span><span><b>Batch:</b> ${esc(a.batch)}</span><span><b>Roll No:</b> ${esc(a.roll)}</span><span><b>Optional:</b> ${esc(a.subject)}</span></div>

  ${a.principal.status!=='pending'?`<div class="row"><span><b>Principal's order (${fmtDT(a.principal.at)}):</b> ${esc(a.principal.order||'—')}</span></div>`:''}

  const head=['Sl No','Ref No','Date & Time Submitted','Name of Student','Batch','Roll Number','Optional Subject','Date of Leave','No. of Days','Reason for Leave','Teacher Decision','Teacher Remark','Principal Final Order'];
  const data=()=>rows().map((a,i)=>[i+1,a.id,fmtDT(a.submitted),a.name,a.batch,a.roll,a.subject,fmtD(a.date),a.days,a.reason,

  $('#dl').onclick=()=>{const d=data();if(!d.length){$('#pvo').innerHTML='<div class="msg err">No applications in this month.</div>';return}
    const m=$('#mo').value;const title='Karmela Rani Training College, Kollam – Leave Report '+m;
    const blob=makeXlsx(title,head,d);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Leave_Report_'+m+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);};
  $('#pv').click();
}
function localMonth(iso){const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

/* ---------- Minimal XLSX writer (no external libraries) ---------- */
function makeXlsx(title,head,rows){
  const X=s=>String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
  const col=i=>String.fromCharCode(65+i);
  const cell=(v,r,c,s)=>typeof v==='number'?`<c r="${col(c)}${r}" s="${s}"><v>${v}</v></c>`:`<c r="${col(c)}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
  const widths=[7,16,24,24,12,12,18,14,10,40,16,26,42];
  let sd=`<row r="1" ht="24" customHeight="1">${cell(title,1,0,3)}</row><row r="2">${head.map((h,i)=>cell(h,2,i,1)).join('')}</row>`;
  rows.forEach((r,ri)=>{sd+=`<row r="${ri+3}">${r.map((v,i)=>cell(v,ri+3,i,2)).join('')}</row>`});
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${sd}</sheetData><mergeCells count="1"><mergeCell ref="A1:${col(head.length-1)}1"/></mergeCells></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="14"/><color rgb="FF6A1B9A"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF6A1B9A"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBBBBBB"/></left><right style="thin"><color rgb="FFBBBBBB"/></right><top style="thin"><color rgb="FFBBBBBB"/></top><bottom style="thin"><color rgb="FFBBBBBB"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`;
  const files={
   '[Content_Types].xml':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`,
   '_rels/.rels':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
   'xl/workbook.xml':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Leave Report" sheetId="1" r:id="rId1"/></sheets></workbook>`,
   'xl/_rels/workbook.xml.rels':`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
   'xl/styles.xml':styles,'xl/worksheets/sheet1.xml':sheet};
  return zipStore(files);
}
function zipStore(files){
  const enc=new TextEncoder(),T=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  const parts=[],central=[];let off=0;
  for(const [name,txt] of Object.entries(files)){
    const nb=enc.encode(name),db=enc.encode(txt),c=crc(db);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
    lh.setUint32(14,c,true);lh.setUint32(18,db.length,true);lh.setUint32(22,db.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
